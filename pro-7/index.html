<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> menu </title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: #1c1c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            cursor: pointer;
        }

        .contain {
            width: 700px;
            height: 400px;
            background: gray url('image/back/gif.gif') center center no-repeat;
            background-size: cover;
            display: flex;
            position: relative;
        }

        .menu {
            width: 100px;
            height: 100%;
            background-color: #000000b6;
            z-index: 2;
        }

        .painel {
            display: none;
            width: 300px;
            height: 100%;
            background-color: #00000080;
            position: absolute;
            left: 100px;
            top: 0;
            z-index: 1;
            padding: 0;
            color: #ffffff;
        }

        .contain:has(.card:hover) .painel, .painel:hover {
            display: block;
        }

        .card {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 1s ease;
        }

        .card:hover {
            background-color: #203f49;
        }

        .home {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .home:hover {
            background-color: #203f49b0;
            padding: 20px;
        }

        .home p {
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        .settings {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings:hover {
            background-color: #203f49b0;
            padding: 20px;
        }

        .settings p {
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        .account {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .account:hover {
            background-color: #203f49b0;
            padding: 20px;
        }

        .account p {
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <div class="contain">
        <div class="menu">
            <div class="card"> <img src="image/ico/home.png" alt="home"></div>
            <div class="card"> <img src="image/ico/settings.png" alt="settings"></div>
            <div class="card"> <img src="image/ico/account.png" alt="account"></div>
        </div>

        <div class="painel">
            <div class="home"> <p>HOME</p> </div>
            <div class="settings"> <p>SETTINGS</p> </div>
            <div class="account"> <P>account</P> </div>
        </div>
    </div>

</body>
</html>
