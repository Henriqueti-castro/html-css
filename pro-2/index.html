<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> nav hover</title>
    <style>

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d24;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar {
            background-color: #000000;
            width: 450px;
            height: 90px;
            gap: 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            padding: 20px;
        }

        .navbar a:hover {
            box-shadow: 0px 0px 10px white;
            border-radius: 10px;
            transition: 0.5s;
            transform: scale(1.1);
        }

    </style>
</head>
<body>       
    
        <nav class="navbar">
            <a href=""> Home </a>
            <a href=""> About </a>
            <a href=""> Services </a>
            <a href=""> Contact </a>
        </nav>

</body>
</html>
