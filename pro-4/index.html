<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> flex direction </title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        body {
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background-color: rgb(34, 34, 34);
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column-reverse;
            gap: 30px;
            border-radius: 20px;
            width: 500px;
            height: 500px;
            background-color: gray;
        }

        .card1{
            background-color: black;
            width: 100px;
            height: 100px;
            border-radius: 20px;
        }

        .card2 {
            background-color: red;
            width: 100px;
            height: 100px;
            border-radius: 20px;
        } 

        .card3 {
            background-color: #008000;
            width: 100px;
            height: 100px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card1"></div>
        <div class="card2"></div>
        <div class="card3"></div>
    </div>
 
                                                            
</body>
</html>
