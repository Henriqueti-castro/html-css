<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> hover effect</title>
    <style>

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: #1c1c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            cursor: pointer;
        }

        .wrapper {
            display: flex;
            width: 750px;
            height: 350px;
            overflow: hidden;
            border-radius: 20px;
        }

        .card {
            position: relative;
            flex: 1;
            overflow: hidden;
            transition: flex 0.5s ease-in-out;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(70%) contrast(90%);
            transition: filter 0.5s ease-in-out;
        }

        .card:hover {
            flex: 3;
        }

        .card:hover img {
            filter: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <img src="image/img1.gif" alt="gif">
        </div>

        <div class="card">
            <img src="image/img2.gif" alt="gif2">
        </div>

        <div class="card">
            <img src="image/img3.gif" alt="gif3">
        </div>
    </div>
</body>
</html>
